# Integração contínua do Nexus LS.
# Roda em todo push e pull request para a main: compila, testa, audita pacotes
# e confere que o editor do catálogo (React/JSX em web/catalogo) continua compilando.
# Nenhum segredo é usado aqui.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Só precisa ler o código.
permissions:
  contents: read

# Um push novo cancela a execução anterior da mesma branch (economiza minutos).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # .NET: compila a solução, roda as duas suítes e audita os pacotes NuGet.
  # ---------------------------------------------------------------------------
  dotnet:
    name: Build, testes e auditoria (.NET)
    runs-on: windows-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o SDK do .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar as dependências
        run: dotnet restore NexusLS.slnx

      - name: Compilar em Release
        run: dotnet build NexusLS.slnx --no-restore -c Release

      # Testes das regras de negócio (Core + SQLite em memória).
      - name: Testar o núcleo (Core)
        run: >
          dotnet test tests/NexusLS.Tests/NexusLS.Tests.csproj
          --no-build -c Release
          --logger "trx;LogFileName=core.trx"

      # Testes das telas/ViewModels (fluxo do PDV, tecla por tecla, sem abrir janela).
      - name: Testar a interface (App)
        run: >
          dotnet test tests/NexusLS.App.Tests/NexusLS.App.Tests.csproj
          --no-build -c Release
          --logger "trx;LogFileName=app.trx"

      # A auditoria precisa FALHAR o job quando houver vulnerabilidade conhecida.
      # O comando `dotnet list package --vulnerable` costuma sair com código 0 mesmo
      # encontrando problemas, por isso o texto também é conferido.
      - name: Auditar pacotes com vulnerabilidades conhecidas
        shell: pwsh
        continue-on-error: false
        env:
          DOTNET_CLI_UI_LANGUAGE: en
        run: |
          $saida = dotnet list NexusLS.slnx package --vulnerable --include-transitive 2>&1
          $codigo = $LASTEXITCODE
          $saida | ForEach-Object { Write-Host $_ }

          if ($codigo -ne 0) {
            Write-Host "::error::A auditoria de pacotes não pôde ser executada (código $codigo)."
            exit $codigo
          }

          $texto = $saida -join "`n"
          if ($texto -match 'following vulnerable packages|seguintes pacotes vulneráveis') {
            Write-Host "::error::Há pacote(s) com vulnerabilidade conhecida. Atualize ou substitua antes de publicar."
            exit 1
          }

          Write-Host "Nenhum pacote vulnerável conhecido."

      # Sobe os .trx mesmo quando um teste falha, para dar para ver o que quebrou.
      - name: Publicar os resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-testes-dotnet
          path: |
            tests/**/TestResults/*.trx
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Editor do catálogo: React/JSX dentro do WebView2 (web/catalogo).
  # O build gera o dist que depois é empacotado por web/construir.ps1.
  # ---------------------------------------------------------------------------
  catalogo:
    name: Build do catálogo (web)
    runs-on: windows-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/catalogo/package-lock.json

      - name: Instalar as dependências do catálogo
        working-directory: web/catalogo
        run: npm ci

      - name: Compilar o catálogo
        working-directory: web/catalogo
        run: npm run build
